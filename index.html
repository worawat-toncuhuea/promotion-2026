#nnpromo .empty{text-align:center;padding:40px;color:#6b7280}
@media(max-width:640px){#nnpromo .grid{grid-template-columns:repeat(3,1fr)}#nnpromo .grid div{font-size:13px;padding:8px 6px}#nnpromo .grid div{background:#fff!important}}
